# GitHub device-flow proxy for diegoatencia.dev/forja.
# Plain CloudFormation (no SAM transform), same shape as template-progress-cfn.yaml.
# No secret is stored here: device flow only needs the OAuth App's public client id.
AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub device-flow proxy for the forja web app (structurally CORS-safe sign-in)

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the zipped Lambda code.
  CodeKey:
    Type: String
    Default: github-device/github-device.zip
    Description: S3 key of the zipped Lambda code (codecraft/github_proxy/app.py at the zip root).
  GithubClientId:
    Type: String
    Description: >-
      Public client id of the GitHub OAuth App. Create one at
      https://github.com/settings/applications/new (homepage
      https://diegoatencia.dev/forja/), then enable "Device flow" on the app.
      No client secret is used or stored.
  AllowedOrigin:
    Type: String
    Description: Comma-separated list of allowed CORS origins.
    Default: >-
      https://diegoatencia.dev,https://www.diegoatencia.dev,https://alektebel.github.io,http://127.0.0.1:8875,http://localhost:8875

Resources:
  GithubProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GithubProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 20
      MemorySize: 128
      Role: !GetAtt GithubProxyRole.Arn
      Environment:
        Variables:
          GITHUB_CLIENT_ID: !Ref GithubClientId
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  # CORS is answered in app.py, not by API Gateway.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: forja-github-device
      ProtocolType: HTTP

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GithubProxyFunction.Arn
      PayloadFormatVersion: '2.0'

  DeviceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /device'
      Target: !Sub 'integrations/${HttpIntegration}'

  TokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /token'
      Target: !Sub 'integrations/${HttpIntegration}'

  DevicePreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'OPTIONS /device'
      Target: !Sub 'integrations/${HttpIntegration}'

  TokenPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'OPTIONS /token'
      Target: !Sub 'integrations/${HttpIntegration}'

  SmokeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /'
      Target: !Sub 'integrations/${HttpIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GithubProxyFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  GithubProxyEndpoint:
    Description: Paste this URL into the forja-github-proxy meta tag in codecraft/web/index.html
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
