name: Bake forja

# Every push to main rebuilds the /forja catalog (HTML/CSS/JS/logos + baked
# state) and commits it to alektebel/alektebel.github.io, which serves
# diegoatencia.dev/forja (and alektebel.github.io/forja).
#
# FORJA_DEPLOY_KEY is a write deploy key on the site repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forja-bake
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static /forja tree
        run: python3 scripts/forja_site.py "$RUNNER_TEMP/forja-site"

      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: alektebel/alektebel.github.io
          ssh-key: ${{ secrets.FORJA_DEPLOY_KEY }}
          path: site

      - name: Publish if changed
        working-directory: site
        env:
          SITE_SRC: ${{ runner.temp }}/forja-site
        run: |
          set -euo pipefail
          mkdir -p forja/logos
          STRIP="$GITHUB_WORKSPACE/scripts/forja_strip_json.py"

          # One-time: park the old dc-runtime map under forja/legacy/
          if [ -f forja/support.js ] && [ ! -f forja/legacy/support.js ]; then
            mkdir -p forja/legacy
            for f in index.html styles.css support.js; do
              [ -f "forja/$f" ] && mv "forja/$f" "forja/legacy/$f"
            done
          fi

          changed=0

          for f in index.html styles.css app.js learning.js editor.js py-worker.mjs workspace.json; do
            if ! cmp -s "$SITE_SRC/$f" "forja/$f" 2>/dev/null; then
              cp "$SITE_SRC/$f" "forja/$f"
              changed=1
            fi
          done
          mkdir -p forja/logos
          if ! diff -rq "$SITE_SRC/logos" forja/logos >/dev/null 2>&1; then
            rsync -a --delete "$SITE_SRC/logos/" forja/logos/
            changed=1
          fi

          for f in state.json data.json; do
            if [ "$(python3 "$STRIP" "$SITE_SRC/$f")" != "$(python3 "$STRIP" "forja/$f")" ]; then
              cp "$SITE_SRC/$f" "forja/$f"
              changed=1
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "forja site unchanged"
            exit 0
          fi

          git config user.name "forja-bake"
          git config user.email "forja-bake@users.noreply.github.com"
          git add forja
          git commit -m "forja: catalog + rebake from forja@${GITHUB_SHA::7}"
          git push
